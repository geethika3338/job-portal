<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student Dashboard')}"></head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="container dashboard-grid">
        <aside class="sidebar">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; margin: 0 auto 1rem;">
                    <span th:text="${#strings.substring(user.fullName, 0, 1)}">U</span>
                </div>
                <h3 th:text="${user.fullName}" style="margin-bottom: 0.25rem;">Student Name</h3>
                <p class="text-muted" th:text="${user.email}" style="font-size: 0.875rem;">student@example.com</p>
                
                <div style="margin-top: 1rem;">
                    <span th:if="${user.resumePath != null}" class="badge badge-success"><i class="fa-solid fa-check"></i> Resume Uploaded</span>
                    <span th:if="${user.resumePath == null}" class="badge badge-warning"><i class="fa-solid fa-triangle-exclamation"></i> No Resume</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a th:href="@{/student/dashboard}" class="active"><i class="fa-solid fa-search"></i> Browse Jobs</a>
                <a th:href="@{/student/applications}"><i class="fa-solid fa-file-alt"></i> My Applications</a>
            </nav>

            <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border);">
                <h4 style="font-size: 1rem; margin-bottom: 1rem;">Update Resume</h4>
                <form th:action="@{/student/resume/upload}" method="post" enctype="multipart/form-data">
                    <input type="file" name="resume" class="form-control" style="padding: 0.5rem; font-size: 0.875rem; margin-bottom: 0.5rem;" required>
                    <button type="submit" class="btn btn-secondary btn-sm" style="width: 100%;">Upload</button>
                </form>
            </div>
        </aside>

        <section>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>Find Jobs</h2>
                <form th:action="@{/student/dashboard}" method="get" style="display: flex; gap: 0.5rem;">
                    <input type="text" name="query" th:value="${query}" placeholder="Search jobs, skills..." class="form-control" style="width: 250px;">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-search"></i></button>
                    <a th:href="@{/student/dashboard}" class="btn btn-secondary" th:if="${query != null}"><i class="fa-solid fa-times"></i></a>
                </form>
            </div>

            <div th:if="${#lists.isEmpty(jobs)}" class="glass-card" style="text-align: center; padding: 4rem 2rem;">
                <i class="fa-solid fa-inbox" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
                <h3>No jobs found</h3>
                <p class="text-muted">Try adjusting your search criteria.</p>
            </div>

            <div class="job-grid" th:unless="${#lists.isEmpty(jobs)}">
                <div class="glass-card" th:each="job : ${jobs}" style="display: flex; flex-direction: column;">
                    <div style="margin-bottom: 1rem;">
                        <h3 th:text="${job.title}" style="margin-bottom: 0.5rem; color: var(--primary);">Job Title</h3>
                        <p class="text-muted" th:text="${job.employer.fullName}"><i class="fa-solid fa-building"></i> Company Name</p>
                    </div>
                    
                    <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem;">
                        <span class="badge badge-secondary"><i class="fa-solid fa-layer-group"></i> [[${job.category}]]</span>
                        <span class="badge badge-secondary"><i class="fa-solid fa-location-dot"></i> [[${job.location}]]</span>
                        <span class="badge badge-success"><i class="fa-solid fa-money-bill"></i> [[${job.salary}]]</span>
                    </div>
                    
                    <div style="margin-top: auto;">
                        <a th:href="@{'/student/job/' + ${job.id}}" class="btn btn-primary" style="width: 100%;">View Details</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
