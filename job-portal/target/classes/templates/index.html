<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main>
        <div class="container hero">
            <h1 class="hero-title">Find Your Next <span class="text-gradient">Dream Job</span></h1>
            <p class="hero-subtitle">Connect with top employers, explore tailored opportunities, and push your career to the next level with NovaJobs.</p>
            
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a th:href="@{/register}" class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1.125rem;">Start Exploring</a>
                <a th:href="@{/login}" class="btn btn-secondary" style="padding: 1rem 2rem; font-size: 1.125rem;">Login</a>
            </div>

            <div style="margin-top: 5rem; display: flex; justify-content: center; gap: 3rem; color: var(--text-muted);">
                <div style="text-align: center;">
                    <h2 class="text-gradient" style="font-size: 2.5rem; margin-bottom: 0.5rem;">500+</h2>
                    <p>Companies Hiring</p>
                </div>
                <div style="text-align: center;">
                    <h2 class="text-gradient" style="font-size: 2.5rem; margin-bottom: 0.5rem;">12k+</h2>
                    <p>Active Jobs</p>
                </div>
                <div style="text-align: center;">
                    <h2 class="text-gradient" style="font-size: 2.5rem; margin-bottom: 0.5rem;">30k+</h2>
                    <p>Talented Candidates</p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
