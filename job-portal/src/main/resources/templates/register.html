<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
        <div class="glass-card" style="width: 100%; max-width: 500px;">
            <h2 style="text-align: center; margin-bottom: 2rem;">Create Account</h2>
            
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            
            <form th:action="@{/register}" method="post" th:object="${user}">
                
                <div class="form-group">
                    <label>I am a...</label>
                    <div style="display: flex; gap: 1rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-main); font-weight: normal; cursor: pointer;">
                            <input type="radio" th:field="*{role}" value="STUDENT" required> Job Seeker / Student
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-main); font-weight: normal; cursor: pointer;">
                            <input type="radio" th:field="*{role}" value="EMPLOYER" required> Employer
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color: var(--danger); font-size: 0.875rem; margin-top: 0.25rem;"></div>
                </div>
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: var(--danger); font-size: 0.875rem; margin-top: 0.25rem;"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: var(--danger); font-size: 0.875rem; margin-top: 0.25rem;"></div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign Up</button>
            </form>
            
            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
                Already have an account? <a th:href="@{/login}">Login</a>
            </p>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
